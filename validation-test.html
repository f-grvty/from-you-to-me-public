<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation validation test</title><style>body{font-family:system-ui;padding:24px;max-width:820px;margin:auto}pre{white-space:pre-wrap;background:#f4f4f4;padding:14px;border-radius:10px}.ok{color:#126c2f}.bad{color:#a11}</style></head><body><h1>Reservation validation test</h1><p>Safe test: uses non-existent BOOK 999, so no real book can be reserved.</p><div id="out">Running…</div><script>const API='https://script.google.com/macros/s/AKfycbwyXTdeFwq_zzkaC5PbqQ_K-_10pNp_l4-optHxiZ7bNcKQeuUnyko_SKdx3KRV80Co/exec';const out=document.getElementById('out');async function post(data){const r=await fetch(API,{method:'POST',redirect:'follow',body:new URLSearchParams(data)});return await r.json()}const tests=[['invalid name',{action:'reserve',book_id:'999',buyer_name:'A',buyer_phone:'+35799123456',buyer_email:'',buyer_contact:'Телефон/WhatsApp: +35799123456',fulfilment:'PICKUP_LIMASSOL',payment_method:'REVOLUT'},'INVALID_NAME'],['invalid phone',{action:'reserve',book_id:'999',buyer_name:'Anna',buyer_phone:'123',buyer_email:'',buyer_contact:'Телефон/WhatsApp: 123',fulfilment:'PICKUP_LIMASSOL',payment_method:'REVOLUT'},'INVALID_PHONE'],['invalid email',{action:'reserve',book_id:'999',buyer_name:'Anna',buyer_phone:'+35799123456',buyer_email:'bad-email',buyer_contact:'Телефон/WhatsApp: +35799123456 · Email: bad-email',fulfilment:'PICKUP_LIMASSOL',payment_method:'REVOLUT'},'INVALID_EMAIL'],['valid contact reaches book lookup',{action:'reserve',book_id:'999',buyer_name:'Anna',buyer_phone:'+35799123456',buyer_email:'anna@example.com',buyer_contact:'Телефон/WhatsApp: +35799123456 · Email: anna@example.com',fulfilment:'PICKUP_LIMASSOL',payment_method:'REVOLUT'},'BOOK_NOT_FOUND']];async function run(){let html='';for(const [name,data,expected] of tests){try{const x=await post(data);const got=x.error||x.status||JSON.stringify(x);const ok=got===expected;html+=`<p class="${ok?'ok':'bad'}">${name}: ${ok?'OK':'FAILED'} — expected ${expected}, got ${got}</p><pre>${JSON.stringify(x)}</pre>`}catch(e){html+=`<p class="bad">${name}: REQUEST FAILED</p><pre>${String(e)}</pre>`}}out.innerHTML=html}run();</script></body></html>
