<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API connection test</title><style>body{font-family:system-ui;padding:24px;max-width:760px;margin:auto}pre{white-space:pre-wrap;background:#f4f4f4;padding:14px;border-radius:10px}.ok{color:#126c2f}.bad{color:#a11}</style></head><body><h1>Reservation API test</h1><p>This page is unlinked and only tests browser-to-Apps-Script access.</p><div id="out">Running…</div><script>const API='https://script.google.com/macros/s/AKfycbwyXTdeFwq_zzkaC5PbqQ_K-_10pNp_l4-optHxiZ7bNcKQeuUnyko_SKdx3KRV80Co/exec';const out=document.getElementById('out');async function run(){let s='';try{const r=await fetch(API+'?action=inventory',{redirect:'follow'});const t=await r.text();s+='<p class="ok">GET inventory: OK</p><pre>'+escapeHtml(t)+'</pre>'}catch(e){s+='<p class="bad">GET inventory: FAILED</p><pre>'+escapeHtml(String(e))+'</pre>'}try{const body=new URLSearchParams({action:'ping'});const r=await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const t=await r.text();s+='<p class="ok">POST ping: OK</p><pre>'+escapeHtml(t)+'</pre>'}catch(e){s+='<p class="bad">POST ping: FAILED</p><pre>'+escapeHtml(String(e))+'</pre>'}out.innerHTML=s}function escapeHtml(x){return x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}run();</script></body></html>
